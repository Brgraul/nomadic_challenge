[project]
name = "grid-ops"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Raúl Berganza Gómez", email = "brgraul@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.2",
    "ortools>=9.15.6755",
    "pandapower>=3.5.6",
    "pydeck>=0.9.3",
    "streamlit>=1.66.1",
]

[project.scripts]
grid-ops = "grid_ops:main"
grid-ops-eval = "grid_ops.evaluation:_main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"e2e/*" = ["E501"]
